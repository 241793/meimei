<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta http-equiv="Cache-Control" content="no-transform"> 
    <meta http-equiv="Cache-Control" content="no-siteapp">
    <meta name="referrer" content="never">
    <meta name="renderer" content="webkit">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>随机观看小姐姐视频_网页在线版</title>
    <link rel="stylesheet" href="./assets/style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>随机视频</h1>
        </header>
        
        <main class="main-content">
            <div class="video-container">
                <video id="player" src="" controls webkit-playsinline playsinline></video>
            </div>
            
            <div class="controls">
                <button id="switch" class="btn btn-toggle">连续播放: 开</button>
                <button id="next" class="btn btn-primary">播放</button>
            </div>
        </main>
    </div>

    <script>


    (function (window, document) {
        var get = function (id) {
            return document.getElementById(id);
        }
        var bind = function (element, event, callback) {
            return element.addEventListener(event, callback);
        }
        var auto = true;
        var player = get('player');
        var next = get('next');
        var randomm = function () {
            if (next.textContent === "播放"){
                next.textContent = "下一个视频";
            }
            player.src = 'http://av.npcq.cn/pc.php';
            player.attributes = {
                'autoplay': 'autoplay',
                'webkit-playsinline': 'webkit-playsinline',
                'playsinline': 'playsinline'
            };
            document.getElementById("player").play()
        }

        bind(get('next'), 'click', randomm);
        bind(player, 'error', function () {
            randomm();
        });
        bind(get('switch'), 'click', function () {
            auto = !auto;
            this.innerText = '连续播放: ' + (auto ? '开' : '关');
        });
        bind(player, 'ended', function () {


            if (auto) randomm();
        });
    })(window, document);
    </script>
</body>
</html>
